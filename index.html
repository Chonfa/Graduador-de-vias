<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1b18">
  <title>Graduador de vías</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 22c-2-6 2-14 9-15 6-1 12 3 11 9-1 5-5 6-8 9-3 3-10 3-12-3z' fill='%23e8590c'/%3E%3Ccircle cx='15' cy='15' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra-top">
    <a href="#/" class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22c-2-6 2-14 9-15 6-1 12 3 11 9-1 5-5 6-8 9-3 3-10 3-12-3z"/><circle cx="15" cy="15" r="3"/></svg>
      <span>Graduador <em>de vías</em></span>
    </a>
    <a href="#/nueva" class="boton boton-chico"><span aria-hidden="true">＋</span> Cargar vía</a>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <template id="t-lista">
    <section class="intro">
      <h1>Vías del gimnasio</h1>
      <p class="contador"></p>
    </section>
    <div class="buscador">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="buscar" type="search" placeholder="Buscar por nombre, sector, color o grado" aria-label="Buscar">
    </div>
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por sector"></div>
    <ul id="vias" class="grilla"></ul>
  </template>

  <template id="t-nueva">
    <a href="#/" class="volver">← Volver</a>
    <h1>Cargar vía</h1>
    <form id="form-via" class="form">
      <label class="foto-drop">
        <input name="foto" type="file" accept="image/*" capture="environment">
        <img id="preview" hidden alt="">
        <span class="foto-texto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <b>Sacá una foto del inicio</b>
          <small>Que se vean las presas de salida</small>
        </span>
      </label>
      <label>Nombre<input name="nombre" required maxlength="80" placeholder="Ej: La amarilla del techo"></label>
      <div class="campo">
        <span class="etiqueta">Color de presas</span>
        <div class="muestras" id="muestras"></div>
        <input name="color" maxlength="30" placeholder="U otro color…" aria-label="Color de presas">
      </div>
      <div class="campo">
        <span class="etiqueta">Sector</span>
        <div class="segmentado" id="opciones-sector"></div>
      </div>
      <label>Grado marcado<select name="grado" required></select></label>
      <label>Descripción<textarea name="descripcion" rows="3" maxlength="1000" placeholder="Por dónde arranca, qué presas valen, etc."></textarea></label>
      <p class="error" id="error"></p>
      <button type="submit" class="boton boton-grande">Guardar vía</button>
    </form>
  </template>

  <template id="t-via">
    <article class="detalle">
      <div class="hero">
        <img class="hero-foto" hidden alt="Inicio de la vía">
        <a href="#/" class="hero-volver" aria-label="Volver">←</a>
        <div class="hero-texto">
          <span class="pill-desmontada" hidden>Desmontada</span>
          <h1 class="nombre"></h1>
          <p class="meta"></p>
        </div>
        <span class="grado grado-hero"></span>
      </div>

      <p class="descripcion"></p>
      <section class="consenso"></section>

      <div class="cta">
        <button class="boton boton-grande" id="btn-encadene">✔ La encadené</button>
      </div>

      <form id="form-encadene" class="form tarjeta-form" hidden>
        <h2>¡Bien ahí! Contanos</h2>
        <label>Tu nombre<input name="escalador" required maxlength="60" autocomplete="nickname"></label>
        <div class="campo">
          <span class="etiqueta">¿Cómo la encadenaste?</span>
          <div class="segmentado">
            <label><input type="radio" name="estilo" value="top" required><span>De top</span></label>
            <label><input type="radio" name="estilo" value="primero"><span>De primero</span></label>
          </div>
        </div>
        <div class="campo">
          <span class="etiqueta">¿Qué grado pensás que es?</span>
          <div class="chips-grado" id="chips-grado"></div>
          <select id="grado-otro" aria-label="Otro grado"></select>
        </div>
        <label><span>Comentario <small>(opcional)</small></span><input name="comentario" maxlength="500" placeholder="Ej: el crux es mucho más duro que el resto"></label>
        <p class="error" id="error"></p>
        <div class="acciones">
          <button type="button" class="boton boton-secundario" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="boton">Enviar opinión</button>
        </div>
      </form>

      <h2 class="titulo-seccion">Encadenes <span class="cuenta"></span></h2>
      <ul class="encadenes"></ul>
      <button class="link" id="btn-activa"></button>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="grados.js"></script>
  <script src="app.js"></script>
</body>
</html>
